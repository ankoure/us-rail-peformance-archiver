  # Transport for New South Wales -- github #51. Portal
  # https://opendata.transport.nsw.gov.au/data/user/register. One shared
  # credential covers all 8 agencies below.
  #
  # base_url is the bare host and each feed's `path` carries its API version.
  # This is deliberate: the v1/v2 split is per-line, not legacy-vs-current, and
  # it cuts across agencies -- Inner West light rail is v2 while CBD/SE and
  # Newcastle are v1 -- so a versioned base_url cannot express one agency
  # spanning both. Host-only base_url is also what scripts/gen_feeds_from_mdb.py
  # generates for every machine-derived agency; the versioned form these blocks
  # used to have was the outlier.
  #
  # Endpoint survey 2026-09-01. Deliberately NOT configured:
  #   - v2 ferries (/v2/gtfs/{realtime,vehiclepos}/ferries/sydneyferries):
  #     responds 200 but is dead -- byte-identical across fetches, zero
  #     entities, header frozen at 2025-10-24. The v1 endpoints are live and
  #     are what TFNSW_FERRIES below uses.
  #   - per-mode alerts (/v2/gtfs/alerts/{sydneytrains,metro,lightrail,
  #     ferries,buses,nswtrains}): all verified strict subsets of alerts/all
  #     by entity id, so adding them would double-archive the same alerts.

  # mdb-2449 (this agency's static schedule, below, shared by all TFNSW_*
  # agencies) is TfNSW's "Timetables Complete GTFS" -- every operator in the
  # state, regional/trackwork/coach routes included: 698 agency_id rows,
  # shapes.txt alone 1.01 GB. Confirmed 2026-09-06: reading it unfiltered
  # SIGKILLed every TFNSW_* agency except sydney-trains in stage-gtfs (exit
  # -9), the same class of bug as GO_AHEAD/Entur -- see
  # analysis/static_gtfs.py's StaticGtfs docstring. This generic "TFNSW"
  # agency (alerts only, spanning every mode) is the one exception left
  # unscoped: unlike the other seven, there's no single agency_id/route_type
  # that correctly represents "could be any mode" without risking a wrong
  # (rather than just incomplete) marts build. Revisit if it keeps SIGKILLing.
  - agency_id: TFNSW
    name: Transport for New South Wales
    region: New South Wales
    timezone: Australia/Sydney
    base_url: https://api.transport.nsw.gov.au
    mdb_feed_id: mdb-2449
    auth:
      type: api_key
      header: Authorization
      env: TFNSW_API_KEY
    feeds:
      - name: tfnsw-alerts
        path: /v2/gtfs/alerts/all
        expected_format: protobuf
        decoder: tfnsw
        poll_interval_seconds: 60

