  # NB: tfnsw-buses-trips is by far the largest feed in this config -- ~4.7MB
  # and ~3350 entities per poll, i.e. ~6.8 GB/day at the 60s interval below
  # (~13.5 GB/day if dropped to 30s like the rest). For scale, metro-houston-
  # trips is ~1.7 GB/day. The 60s interval is a deliberate cost decision, not
  # an oversight -- check landing-zone growth before lowering it.
  - agency_id: TFNSW_BUSES
    name: Transport for New South Wales - Buses
    region: New South Wales
    timezone: Australia/Sydney
    base_url: https://api.transport.nsw.gov.au
    mdb_feed_id: mdb-2449
    auth:
      type: api_key
      header: Authorization
      env: TFNSW_API_KEY
    feeds:
      # route_type, not agency_id: 644 distinct bus-operator agency_ids in
      # mdb-2449 isn't practical to enumerate. 700/712/714 are the extended
      # (AU-specific) bus route_type codes that cover the whole bus network,
      # derived from mdb-2449 itself (confirmed 2026-09-06) rather than
