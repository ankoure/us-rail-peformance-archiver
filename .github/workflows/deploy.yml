name: deploy

on:
  push:
    branches: [main]
    # Only files that actually require restarting the EC2 poller containers.
    # Everything else that affects the image (gold.py, rollup.py, analysis/,
    # etc.) is covered by build.yml's own trigger, which keeps `:latest`
    # fresh for the Fargate rollup task without touching the box. Keep this
    # list paired with the ignore list in build.yml's push trigger.
    paths:
      - "main.py"
      - "archiver/**"
      - "rail-decoder/**"
      - "config/feeds.yaml"
      - "compose.prod.yml"
      - "dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".dockerignore"
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      # One box per region (see terraform/box.tf, box_eu.tf, box_au.tf).
      # `services` is passed straight to `docker compose up -d`: empty means
      # every service in compose.prod.yml (today's us-east-1 behavior,
      # unchanged); eu/au name only what they actually run, since they don't
      # start app-shard-1 (single-shard boxes, see compose.prod.yml).
      matrix:
        include:
          - name: us
            region: us-east-1
            services: ""
          - name: eu
            region: eu-central-1
            # app-shard-1 used to run here as a dedicated pinned shard (DELFI),
            # but that feed was disabled 2026-08-26 (see config/feeds.yaml) and
            # the shard was never repointed at anything else -- it just crashed
            # on an empty scheduler heap (Scheduler.next_due()) on every start.
            # Retired here rather than deleted from compose.prod.yml: us-east-1
            # still runs app-shard-1 as the second half of its general pool.
            services: "datadog-agent app-shard-0 autoheal"
          - name: au
            region: ap-southeast-2
            services: "datadog-agent app-shard-0 autoheal"
      fail-fast: false
    concurrency:
      group: deploy-${{ matrix.name }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ matrix.region }}

      - name: SSM RunCommand to pull and restart
        env:
          # One JSON secret {"us": "i-...", "eu": "i-...", "au": "i-..."}
          # instead of one secret per box: GitHub Actions' `secrets` context
          # can't be indexed by a matrix value (only `vars`/`env` support
          # that), so a single JSON blob decoded with jq sidesteps it.
          EC2_INSTANCE_IDS_JSON: ${{ secrets.EC2_INSTANCE_IDS }}
          BOX_NAME: ${{ matrix.name }}
          SERVICES: ${{ matrix.services }}
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ github.sha }}
          # Ceiling for the SSM poll below. Generous on purpose: the cost of
          # waiting is a few idle runner minutes, the cost of being too short is
          # a red deploy that actually succeeded.
          SSM_TIMEOUT_S: "600"
        run: |
          set -euo pipefail

          INSTANCE_ID=$(jq -r --arg k "$BOX_NAME" '.[$k]' <<<"$EC2_INSTANCE_IDS_JSON")
          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "null" ]]; then
            echo "No instance id for box '$BOX_NAME' in EC2_INSTANCE_IDS secret"; exit 1
          fi

          # Script that will run on the EC2 instance via SSM.
          SCRIPT=$(cat <<EOF
          set -euo pipefail
          cd /opt/rail-archiver
          git fetch --quiet origin main
          git reset --hard origin/main
          export IMAGE_TAG="$IMAGE_TAG"
          docker compose -f compose.prod.yml pull $SERVICES
          docker compose -f compose.prod.yml up -d --remove-orphans $SERVICES
          docker image prune -af
          EOF
          )

          B64=$(printf '%s' "$SCRIPT" | base64 -w 0)

          # JSON form avoids shorthand-parser ambiguity with '=' padding and pipes.
          PARAMS=$(jq -n --arg c "echo $B64 | base64 -d | bash" '{commands:[$c]}')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $BOX_NAME ${SHA:0:7}" \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' --output text)

          echo "SSM command ($BOX_NAME): $CMD_ID"

          # Poll explicitly rather than using `aws ssm wait command-executed`:
          # that waiter is hard-coded to 20 attempts x 5s = 100s with no CLI
          # flag to change it, and the Sydney box routinely needs longer just to
          # pull image layers. On 2026-09-04 it timed out at InProgress and
          # failed the job while the command went on to succeed -- a healthy
          # deploy reported red, which is worse than useless because it trains
          # you to ignore the next one.
          DEADLINE=$(( SECONDS + SSM_TIMEOUT_S ))
          while :; do
            # Briefly returns InvocationDoesNotExist right after send-command.
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            if (( SECONDS >= DEADLINE )); then
              echo "Gave up after ${SSM_TIMEOUT_S}s ($BOX_NAME); last status: $STATUS"
              break
            fi
            sleep 10
          done

          echo "::group::stdout ($BOX_NAME)"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text
          echo "::endgroup::"
          echo "::group::stderr ($BOX_NAME)"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' --output text
          echo "::endgroup::"

          [[ "$STATUS" == "Success" ]] || { echo "Deploy failed ($BOX_NAME): $STATUS"; exit 1; }
