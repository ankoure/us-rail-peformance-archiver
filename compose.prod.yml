services:
  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    restart: unless-stopped
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=${DD_SITE:-datadoghq.com}
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
      # Each regional box sets its own DD_HOSTNAME in .env (rail-archiver-eu,
      # rail-archiver-au, ...) so the 3 boxes don't collide in Datadog. Unset
      # on the existing us-east-1 box's .env => same hostname as today.
      - DD_HOSTNAME=${DD_HOSTNAME:-rail-archiver}
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    expose:
      - "8125/udp"

  # Poller, sharded across N=2 processes (the box has 2 vCPUs). Sharding is by
  # agency_id (archiver/shard.py), so each agency — including shared rate-limit
  # blocks like BAY_AREA_511 — lives entirely on one shard, keeping per-agency
  # TokenBucket budgets correct. Add shards by copying a block, bumping
  # --shard-index, and raising --shard-count on every shard in lockstep.
  #
  # The image's HEALTHCHECK marks a container unhealthy if its poll loop stops
  # refreshing poll_state/.heartbeat. `restart: unless-stopped` does not react to
  # health status, so the autoheal sidecar (below) watches for the `autoheal=true`
  # label and restarts unhealthy containers.
  #
  # Each shard gets its OWN host poll_state dir mounted at the same in-container
  # path, so the baked HEALTHCHECK (a fixed /app/data/poll_state/.heartbeat) keeps
  # working unchanged while each shard's heartbeat is independent — a dead shard
  # goes unhealthy on its own instead of being masked by a live sibling sharing
  # the file. poll_state is keyed by feed name and each feed lives on one shard,
  # so nothing is lost by not sharing it. ./archive stays shared: feed names are
  # globally unique, so there are no collisions and rollup consumes one tree.
  #
  # SHARD_COUNT/CONTINENT/WORKERS come from each box's own .env (regional
  # boxes set CONTINENT=eu|au + SHARD_COUNT=1; the us-east-1 box's .env is
  # unchanged, so ${VAR:-default} reproduces today's hardcoded flags exactly).
  # Wrapped in `sh -c` with `$$`-escaping so these are expanded by the
  # CONTAINER's shell at runtime (using env_file's injected env), not by
  # Compose's own (more limited) interpolation at compose-file parse time --
  # in particular ${CONTINENT:+--continent $CONTINENT} needs real POSIX
  # parameter expansion to omit the flag entirely when CONTINENT is unset.
  app-shard-0: &poller
    image: ghcr.io/ankoure/us-rail-performance-archiver:${IMAGE_TAG:-latest}
    restart: unless-stopped
    user: "1000:1000"
    # Docker's default (10s) is shorter than LandingUploader.__aexit__'s own
    # join timeout (_JOIN_TIMEOUT_S = 60s in archiver/landing_uploader.py) --
    # `docker compose up -d` recreating this container on deploy would SIGKILL
    # the old process well before its graceful shutdown (drain in-flight
    # polls, join the landing-uploader thread, run the final drain) can finish,
    # on every deploy, not just this one. 90s = 60s join timeout + a 30s buffer
    # for the rest of that shutdown sequence. Keep in sync if _JOIN_TIMEOUT_S
    # ever changes.
    stop_grace_period: 90s
    labels:
      - autoheal=true
      - "com.datadoghq.ad.logs=[{\"source\": \"python\", \"service\": \"rail-archiver\"}]"
    volumes:
      - ./config:/app/config:ro
      - ./archive:/app/archive
      - ./data/poll_state/shard-0:/app/data/poll_state
    command: >-
      sh -c "python main.py --shard-index 0 --shard-count $${SHARD_COUNT:-2}
      $${CONTINENT:+--continent $$CONTINENT} --workers $${WORKERS:-40}"
    environment:
      # botocore >=1.36 wraps the upload body in a non-seekable AwsChunkedWrapper
      # to add a default request checksum; a retried PutObject then fails with
      # UnseekableStreamError. The LandingUploader retries heavily under S3
      # throttling, so disable the default checksum (S3 doesn't require it).
      - AWS_REQUEST_CHECKSUM_CALCULATION=when_required
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    depends_on:
      - datadog-agent

  # Dual purpose, depending on which box starts it (see deploy.yml):
  #   - us-east-1 (SHARD_COUNT=2): the second half of the general hash pool.
  #   - eu (SHARD_COUNT=1): a dedicated pinned shard. With SHARD_COUNT=1,
  #     index 0 (app-shard-0) IS the whole general pool, so index 1 has no
  #     hash-pool agencies of its own -- it exists purely to run whichever
  #     agencies are pinned there via `shard_pin` in feeds.yaml (currently
  #     GTFS_DE_DELFI_REALTIME_DATA, isolated after its ~150-200MB/5min
  #     payload was causing poll.skipped bursts on the shared EU pool).
  #   au doesn't start this service -- no agency there is pinned (yet).
  app-shard-1:
    <<: *poller
    volumes:
      - ./config:/app/config:ro
      - ./archive:/app/archive
      - ./data/poll_state/shard-1:/app/data/poll_state
    command: >-
      sh -c "python main.py --shard-index 1 --shard-count $${SHARD_COUNT:-2}
      $${CONTINENT:+--continent $$CONTINENT} --workers $${WORKERS:-40}"

  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # The daily rollup+ship+prune that used to run here has moved off-box to a
  # scheduled Fargate Spot task (terraform/, EventBridge -> ECS RunTask) reading
  # the S3 landing zone. The box is now poller-only; landing is shipped to S3 by
  # the in-process LandingUploader (landing_mode: s3).
